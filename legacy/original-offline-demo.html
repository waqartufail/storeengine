<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Northstar — Independent Store</title>
<style>
:root{--ink:#172b3a;--muted:#737b80;--paper:#fbfaf7;--line:#e8e4dc;--gold:#a17b51}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:#1d2932;font:14px Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.top{height:70px;padding:0 6%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fbfaf7;z-index:2}.brand{font-weight:bold;letter-spacing:2px;display:flex;align-items:center;gap:10px}.mark{background:var(--ink);color:white;border-radius:50%;width:34px;height:34px;display:grid;place-items:center;font:22px Georgia}.nav{display:flex;gap:20px}.nav button,.plain{border:0;background:none;color:var(--ink)}.cta{border:0;background:var(--ink);color:#fff;padding:12px 18px}.hero{display:grid;grid-template-columns:1fr 1fr;background:#f0eee8;min-height:400px}.heroText{padding:70px 12%;align-self:center}.eyebrow{font-size:10px;letter-spacing:2px;color:var(--gold);font-weight:bold}.hero h1{font:clamp(42px,6vw,72px)/1.05 Georgia;margin:20px 0}.hero h1 em{color:var(--gold)}.hero p{color:var(--muted);line-height:1.7;max-width:350px}.heroImg{background:linear-gradient(120deg,#b7b2a8,#6d7777);display:grid;place-items:center;color:white;font:italic 28px Georgia;min-height:400px}.wrap{max-width:1200px;margin:auto;padding:60px 5%}.head{display:flex;align-items:end;justify-content:space-between;gap:20px}.head h2{font:34px Georgia;margin:8px 0}.search{padding:10px;border:1px solid var(--line);background:white}.filters{display:flex;gap:8px;margin:25px 0;flex-wrap:wrap}.filters button{border:1px solid var(--line);background:transparent;border-radius:25px;padding:9px 15px}.filters .on{background:var(--ink);color:white}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}.product{background:white;padding-bottom:15px}.photo{height:230px;background:linear-gradient(135deg,#e9e5dd,#c7c1b5);display:grid;place-items:center;color:#8a8175;font:italic 18px Georgia;position:relative}.photo img{width:100%;height:100%;object-fit:cover}.product .info{padding:13px}.meta{display:flex;justify-content:space-between;color:var(--gold);font-size:10px}.product h3{font-size:15px;margin:9px 0 6px}.product p{color:var(--muted);font-size:12px;min-height:28px}.price{font-weight:bold}.add{float:right;border:0;background:var(--ink);color:white;border-radius:50%;width:34px;height:34px}.foot{background:var(--ink);color:white;padding:35px 6%;margin-top:30px}.panel{background:white;border:1px solid var(--line);padding:20px;margin:18px 0}.adminGrid{display:grid;grid-template-columns:1fr 1.5fr;gap:18px}.form{display:grid;gap:10px}.form label{display:grid;gap:6px;font-size:12px;color:var(--muted)}.form input,.form textarea,.form select{padding:10px;border:1px solid var(--line);background:#fff}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}.row small{display:block;color:var(--muted);margin-top:5px}.notice{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:#244d3b;color:white;padding:12px 18px;z-index:8;max-width:90%;box-shadow:0 5px 25px #0002}.overlay{position:fixed;inset:0;background:#0007;z-index:5;display:flex;justify-content:flex-end}.drawer{background:white;width:min(440px,100%);height:100%;overflow:auto;padding:22px;display:flex;flex-direction:column}.drawerHead{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.cartItem{display:flex;justify-content:space-between;gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}.qty{display:flex;gap:9px;align-items:center}.qty button{border:1px solid var(--line);background:white;padding:4px 9px}.muted{color:var(--muted)}.tabs{display:flex;gap:12px}.tabs button{padding:10px 15px;border:1px solid var(--line);background:white}.tabs .on{background:var(--ink);color:white}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.adminGrid{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.heroImg{min-height:220px}.heroText{padding:50px 8%}}@media(max-width:480px){.grid{gap:10px}.photo{height:160px}.wrap{padding:40px 4%}.head{align-items:start;flex-direction:column}.search{width:100%}.nav{gap:8px}.top{padding:0 4%}}

/* Theme system + mobile-first admin polish */
:root{--accent:#2563eb;--accent2:#7c3aed;--surface:#ffffff;--soft:#eef2ff;--btnText:#fff;--shadow:0 10px 28px #172b3a18}
body{background:var(--paper);color:var(--ink)}.top{background:var(--surface);color:var(--ink)}.mark{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}.foot{background:linear-gradient(120deg,var(--accent),var(--accent2));color:#fff}
.cta,.add,.tabs button.on,.filters button.on{background:linear-gradient(125deg,var(--accent),var(--accent2));color:var(--btnText);border:0;box-shadow:var(--shadow);transition:transform .18s,filter .18s}
.cta{border-radius:12px;padding:13px 20px;font-weight:700}.cta:hover,.add:hover,.tabs button:hover{filter:brightness(1.06);transform:translateY(-1px)}
.tabs{flex-wrap:wrap;overflow-x:auto;padding:3px 0 10px}.tabs button,.filters button{border-radius:12px;padding:11px 15px;font-weight:600;white-space:nowrap}
.panel{border-radius:16px;box-shadow:var(--shadow);border-color:var(--line)}.row{flex-wrap:wrap}.row select{max-width:100%;padding:10px;border:1px solid var(--line);border-radius:9px}
.adminFilters{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:10px;margin:15px 0 20px}.adminFilters label{display:grid;gap:6px;color:var(--muted);font-size:12px}.adminFilters input,.adminFilters select{width:100%;min-width:0;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.themeGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.themeChoice{border:2px solid var(--line);border-radius:16px;padding:14px;background:var(--surface);text-align:left;color:var(--ink);display:flex;align-items:center;gap:12px;min-width:0}.themeChoice.selected{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}.swatches{display:flex;gap:4px;flex-shrink:0}.swatches i{width:18px;height:38px;border-radius:7px;display:block}.themeChoice small{display:block;color:var(--muted);margin-top:4px}.statusPill{padding:4px 9px;border-radius:20px;background:var(--soft);color:var(--accent);font-size:11px;font-weight:bold}
@media(max-width:760px){.adminFilters{grid-template-columns:repeat(2,minmax(0,1fr))}.themeGrid{grid-template-columns:1fr}.wrap{padding:30px 4%}.top{height:auto;min-height:62px;gap:8px;flex-wrap:wrap;padding:10px 4%}.nav{order:3;width:100%;justify-content:space-between}.nav button{padding:8px}.tabs{gap:7px}.tabs button{font-size:12px;padding:10px 12px}.panel{padding:14px}.adminGrid{gap:10px}.form input,.form textarea,.form select{min-height:42px}.row>div{min-width:0;overflow-wrap:anywhere}.row select{width:100%}}
@media(max-width:420px){.adminFilters{grid-template-columns:1fr}.brand{font-size:12px}.mark{width:30px;height:30px}.top>.plain{margin-left:auto}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.photo{height:135px}.cta{width:100%}}
</style></head><body><div id="app"></div>
<script>
const starter=[
{id:1,name:"Everyday Backpack",category:"Accessories",price:3490,stock:18,desc:"A practical everyday carry bag.",image:""},
{id:2,name:"Minimal Watch",category:"Accessories",price:5990,stock:12,desc:"Clean design for everyday wear.",image:""},
{id:3,name:"Wireless Headphones",category:"Electronics",price:7990,stock:9,desc:"Comfortable wireless listening.",image:""},
{id:4,name:"Classic Sneakers",category:"Fashion",price:6490,stock:15,desc:"Versatile everyday sneakers.",image:""}
];
let products=JSON.parse(localStorage.getItem("ns_products")||"null")||starter;
let orders=JSON.parse(localStorage.getItem("ns_orders")||"[]"),cart=JSON.parse(localStorage.getItem("ns_cart")||"[]");
let category="All",search="",view="shop",drawer=false,checkout=false,adminTab="orders";
let orderFilters={number:"",product:"",from:"",to:"",status:"All"};
let productFilters={name:"",stock:"All"};
const themes=[
{id:"midnight",name:"Midnight Luxe",desc:"Deep navy with electric violet gradients",colors:["#111827","#6366f1","#a855f7"],vars:{ink:"#e5e7eb",muted:"#a7b0c0",paper:"#0b1020",line:"#29334a",gold:"#c4b5fd",accent:"#6366f1",accent2:"#a855f7",surface:"#151d31",soft:"#29264b"}},
{id:"royal",name:"Royal Gold",desc:"Premium black, royal purple and gold",colors:["#171027","#7c3aed","#d4a84f"],vars:{ink:"#f7f0ff",muted:"#b9adc9",paper:"#110d1c",line:"#392d4e",gold:"#e8c66a",accent:"#7c3aed",accent2:"#d4a84f",surface:"#20172f",soft:"#38264d"}},
{id:"ocean",name:"Ocean Blue",desc:"Fresh blue gradients and crisp whites",colors:["#0c4a6e","#0284c7","#22d3ee"],vars:{ink:"#102a43",muted:"#627d98",paper:"#f0f9ff",line:"#cfe8f5",gold:"#0284c7",accent:"#0284c7",accent2:"#22d3ee",surface:"#fff",soft:"#dff6ff"}},
{id:"emerald",name:"Emerald Green",desc:"Elegant green with mint highlights",colors:["#064e3b","#059669","#6ee7b7"],vars:{ink:"#12372c",muted:"#648579",paper:"#f0fdf7",line:"#cce9dc",gold:"#059669",accent:"#059669",accent2:"#34d399",surface:"#fff",soft:"#d1fae5"}},
{id:"sunset",name:"Sunset Glow",desc:"Warm coral, orange and pink",colors:["#9f1239","#f97316","#fb7185"],vars:{ink:"#44202a",muted:"#916b70",paper:"#fff7f3",line:"#f3d8d2",gold:"#ea580c",accent:"#f97316",accent2:"#ec4899",surface:"#fff",soft:"#ffe4e6"}},
{id:"rose",name:"Rose Gold",desc:"Soft blush with rose-gold accents",colors:["#881337","#e11d48","#f9a8d4"],vars:{ink:"#492333",muted:"#967381",paper:"#fff7fa",line:"#f1dce5",gold:"#be5675",accent:"#e11d48",accent2:"#be5675",surface:"#fff",soft:"#ffe4ef"}},
{id:"lavender",name:"Lavender Dream",desc:"Calm lilac and purple gradients",colors:["#4c1d95","#8b5cf6","#c4b5fd"],vars:{ink:"#30234c",muted:"#807396",paper:"#faf7ff",line:"#e5dcf4",gold:"#8b5cf6",accent:"#8b5cf6",accent2:"#c084fc",surface:"#fff",soft:"#ede9fe"}},
{id:"minimal",name:"Minimal Slate",desc:"Modern neutral grey with blue accent",colors:["#334155","#64748b","#0ea5e9"],vars:{ink:"#1e293b",muted:"#64748b",paper:"#f8fafc",line:"#e2e8f0",gold:"#475569",accent:"#475569",accent2:"#0ea5e9",surface:"#fff",soft:"#e2e8f0"}},
{id:"copper",name:"Copper Premium",desc:"Earthy charcoal and copper highlights",colors:["#292524","#c2410c","#fb923c"],vars:{ink:"#292524",muted:"#78716c",paper:"#faf7f2",line:"#e7ddd0",gold:"#c2410c",accent:"#c2410c",accent2:"#ea580c",surface:"#fff",soft:"#ffedd5"}},
{id:"neon",name:"Neon Pop",desc:"Bold dark theme with vibrant cyan and pink",colors:["#09090b","#06b6d4","#ec4899"],vars:{ink:"#f4f4f5",muted:"#a1a1aa",paper:"#09090b",line:"#27272a",gold:"#22d3ee",accent:"#06b6d4",accent2:"#ec4899",surface:"#18181b",soft:"#27272a"}}
];
let activeTheme=localStorage.getItem("ns_theme")||"royal";
function applyTheme(){const t=themes.find(x=>x.id===activeTheme)||themes[1];document.body.dataset.theme=t.id;for(const [k,v] of Object.entries(t.vars))document.documentElement.style.setProperty("--"+k,v);}
function chooseTheme(id){activeTheme=id;localStorage.setItem("ns_theme",id);applyTheme();render();toast("Theme applied to Store and Admin");}
let integrations=JSON.parse(localStorage.getItem("ns_integrations")||"null")||{defaultShipper:"PostEx",providers:[{name:"PostEx",enabled:true,apiUrl:"",apiToken:"",pickupCode:""},{name:"Leopards",enabled:false,apiUrl:"",apiToken:"",pickupCode:""},{name:"TCS",enabled:false,apiUrl:"",apiToken:"",pickupCode:""},{name:"M&P",enabled:false,apiUrl:"",apiToken:"",pickupCode:""}],whatsapp:{enabled:false,businessPhone:"",phoneId:"",token:"",template:"order_confirmation"},shipping:{baseCharge:200,includedWeight:5,extraPerKg:50},payments:[{name:"Cash on Delivery",type:"cod",enabled:true,details:"Pay when your order arrives",qr:""},{name:"Easypaisa",type:"online",enabled:false,details:"Send payment and enter transaction ID",qr:""},{name:"JazzCash",type:"online",enabled:false,details:"Send payment and enter transaction ID",qr:""},{name:"Bank Transfer",type:"online",enabled:false,details:"Bank account details will appear here",qr:""},{name:"Card Payment",type:"gateway",enabled:false,details:"Online card gateway (integration required)",qr:""}]};
integrations.shipping ||= {baseCharge:200,includedWeight:5,extraPerKg:50};integrations.payments ||= [{name:"Cash on Delivery",type:"cod",enabled:true,details:"Pay when your order arrives",qr:""},{name:"Easypaisa",type:"online",enabled:false,details:"",qr:""},{name:"JazzCash",type:"online",enabled:false,details:"",qr:""},{name:"Bank Transfer",type:"online",enabled:false,details:"",qr:""},{name:"Card Payment",type:"gateway",enabled:false,details:"",qr:""}];
const money=n=>"PKR "+Number(n).toLocaleString("en-PK");
const save=()=>{try{localStorage.setItem("ns_products",JSON.stringify(products));localStorage.setItem("ns_orders",JSON.stringify(orders));localStorage.setItem("ns_cart",JSON.stringify(cart));return true}catch(err){console.warn("Browser storage unavailable; this demo session will not persist after closing the tab.",err);return false}};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(s){let n=document.createElement("div");n.className="notice";n.textContent=s;document.body.append(n);setTimeout(()=>n.remove(),2600)}
function render(){
applyTheme();
let app=document.getElementById("app"),count=cart.reduce((a,x)=>a+x.qty,0),total=cart.reduce((a,x)=>a+x.price*x.qty,0),ship=shippingFor(cart);
app.innerHTML=`<header class="top"><div class="brand"><span class="mark">N</span>NORTHSTAR</div><nav class="nav"><button onclick="go('shop')">Shop</button><button onclick="go('admin')">Admin</button></nav><button class="plain" onclick="toggleCart()">Bag (${count})</button></header>
${view==="shop"?`<section class="hero"><div class="heroText"><div class="eyebrow">THOUGHTFULLY SELECTED · EVERYDAY GOODS</div><h1>Good things.<br><em>Better living.</em></h1><p>Discover useful, well-designed essentials for your everyday life.</p><button class="cta" onclick="document.getElementById('catalog').scrollIntoView({behavior:'smooth'})">Explore collection →</button></div><div class="heroImg">A simpler kind of shopping</div></section>
<main class="wrap" id="catalog"><div class="head"><div><div class="eyebrow">THE COLLECTION</div><h2>Shop essentials</h2></div><input class="search" placeholder="Search products..." value="${esc(search)}" oninput="setSearch(this.value)"></div><div class="filters">${["All",...new Set(products.map(p=>p.category))].map(c=>`<button class="${category===c?'on':''}" onclick="setCategory('${esc(c)}')">${esc(c)}</button>`).join("")}</div><div class="grid">${products.filter(p=>(category==="All"||p.category===category)&&p.name.toLowerCase().includes(search.toLowerCase())&&p.stock>0).map(p=>`<article class="product"><div class="photo">${p.image?`<img src="${esc(p.image)}" onerror="this.remove();this.parentNode.append('Product image')">`:"Product image"}</div><div class="info"><div class="meta"><span>${esc(p.category)}</span><span>${p.stock} available</span></div><h3>${esc(p.name)}</h3><p>${esc(p.desc)}</p><span class="price">${money(p.price)}</span><button class="add" onclick="add(${p.id})">+</button></div></article>`).join("")||"<p>No products found.</p>"}</div></main>`:renderAdmin()}
<footer class="foot"><b>NORTHSTAR</b><p>Independent by design. Built for everyday.</p><small>Local demo · Data stays in this browser</small></footer>
${drawer?`<div class="overlay" onclick="toggleCart()"><aside class="drawer" onclick="event.stopPropagation()"><div class="drawerHead"><h2>Your bag (${count})</h2><button onclick="toggleCart()">Close ✕</button></div>${cart.map(x=>`<div class="cartItem"><div><b>${esc(x.name)}</b><small class="muted"><br>${money(x.price)} each</small><div class="qty"><button onclick="changeQty(${x.id},-1)">−</button>${x.qty}<button onclick="changeQty(${x.id},1)">+</button></div></div><b>${money(x.price*x.qty)}</b></div>`).join("")||"<p class='muted'>Your bag is empty.</p>"}<div style="margin-top:auto;padding-top:20px"><div class="row"><b>Subtotal</b><b>${money(total)}</b></div><div class="row"><b>Shipping (one shipment)</b><b>${money(ship)}</b></div><div class="row"><b>Total</b><b>${money(total+ship)}</b></div><button class="cta" style="width:100%" ${!cart.length?"disabled":""} onclick="checkout=true;render()">Checkout</button>${checkout?`<form id="checkoutForm" class="form" style="margin-top:20px" id="checkoutForm"><h3>Delivery details</h3><label>Full name<input name="customer" required></label><label>Phone<input name="phone" required></label><label>Delivery city<input name="city" required placeholder="e.g. Lahore"></label><label>Address<textarea name="address" required></textarea></label><label>Payment method<select name="payment" required onchange="this.nextElementSibling.innerHTML=paymentInfo(integrations.payments.find(x=>x.name===this.value))">${integrations.payments.filter(x=>x.enabled).map(x=>`<option value="${esc(x.name)}">${esc(x.name)}</option>`).join("")}</select></label><div id="paymentInfo" class="panel">${paymentInfo(integrations.payments.find(x=>x.enabled))}</div><button class="cta" type="submit">Place order</button><small class="muted">Please complete all delivery fields. Your order will be saved in this browser.</small></form>`:""}</div></aside></div>`:""}`;
  const checkoutForm=document.getElementById("checkoutForm");
  if(checkoutForm) checkoutForm.addEventListener("submit", placeOrder);
}
function go(v){view=v;drawer=false;render()}function setCategory(v){category=v;render()}function setSearch(v){search=v;let pos=scrollY;render();document.querySelector(".search").focus();document.querySelector(".search").setSelectionRange(v.length,v.length)}
function toggleCart(){drawer=!drawer;checkout=false;render()}
function add(id){let p=products.find(x=>x.id===id),i=cart.find(x=>x.id===id);if(i){if(i.qty<p.stock)i.qty++}else cart.push({...p,qty:1});save();render();toast("Added to your bag")}
function changeQty(id,d){let x=cart.find(x=>x.id===id),p=products.find(x=>x.id===id);x.qty=Math.min(p.stock,x.qty+d);if(x.qty<=0)cart=cart.filter(a=>a.id!==id);save();render()}
function shippingFor(items){if(!items.length)return 0;const weight=items.reduce((n,x)=>n+(Number(x.weightKg)||0.5)*x.qty,0);const productCharge=Math.max(0,...items.map(x=>Number(x.shippingCharge)||0)) || Number((integrations.shipping||{}).baseCharge||0);const cfg=integrations.shipping||{baseCharge:200,includedWeight:5,extraPerKg:50};const extra=Math.max(0,Math.ceil(weight-Number(cfg.includedWeight||5)))*Number(cfg.extraPerKg||0);return productCharge+extra;}
function paymentInfo(p){if(!p)return "No payment method enabled. Please contact store admin.";return `<b>${esc(p.name)}</b><p>${esc(p.details||"")}</p>${p.qr?`<img src="${esc(p.qr)}" alt="${esc(p.name)} QR" style="max-width:180px;max-height:180px;object-fit:contain">`:p.type==="online"?"<small>QR code will appear here after admin uploads it.</small>":""}`;}
function renderAdmin(){const tabs=[['orders','Orders Status'],['products','Product Addition'],['shipping','Courier Configuration'],['payments','Payment Configurations'],['themes','Themes & Appearance']];let content='';
if(adminTab==='orders'){
 const filtered=orders.slice().reverse().filter(o=>{const date=new Date(o.createdAt||o.id);const day=date.toISOString().slice(0,10);const names=(o.items||[]).map(x=>x.name).join(' ').toLowerCase();return (!orderFilters.number||String(o.id).toLowerCase().includes(orderFilters.number.toLowerCase()))&&(!orderFilters.product||names.includes(orderFilters.product.toLowerCase()))&&(!orderFilters.status||orderFilters.status==='All'||(o.status||'Pending')===orderFilters.status)&&(!orderFilters.from||day>=orderFilters.from)&&(!orderFilters.to||day<=orderFilters.to);});
 content=`<section class="panel"><h3>Orders Status (${filtered.length} / ${orders.length})</h3><div class="adminFilters"><label>Order No<input placeholder="Search order number" value="${esc(orderFilters.number)}" onchange="orderFilters.number=this.value;render()"></label><label>Product<input placeholder="Product name" value="${esc(orderFilters.product)}" onchange="orderFilters.product=this.value;render()"></label><label>From date<input type="date" value="${esc(orderFilters.from)}" onchange="orderFilters.from=this.value;render()"></label><label>To date<input type="date" value="${esc(orderFilters.to)}" onchange="orderFilters.to=this.value;render()"></label><label>Status<select onchange="orderFilters.status=this.value;render()">${['All','Pending','Confirmed','Processing','Shipped','Delivered','Cancelled'].map(x=>`<option ${orderFilters.status===x?'selected':''}>${x}</option>`).join('')}</select></label><button class="cta" type="button" onclick="orderFilters={number:'',product:'',from:'',to:'',status:'All'};render()">Clear filters</button></div>${filtered.length?filtered.map(o=>`<div class="row"><div><b>Order #${o.id} · ${esc(o.customer)}</b><small>${new Date(o.createdAt||o.id).toLocaleString()} · ${esc(o.phone)} · ${esc(o.city||'')} · ${esc(o.address)} · ${money(o.total)} · ${esc(o.payment||'COD')}</small><small>${(o.items||[]).map(x=>`${esc(x.name)} × ${x.qty}`).join(', ')} · Shipping ${money(o.shipping||0)}</small></div><select aria-label="Update order status" onchange="updateStatus(${o.id},this.value)">${['Pending','Confirmed','Processing','Shipped','Delivered','Cancelled'].map(x=>`<option ${o.status===x?'selected':''}>${x}</option>`).join('')}</select></div>`).join(''):'<p class="muted">No orders match these filters.</p>'}</section>`;
}
if(adminTab==='products'){
 const filteredProducts=products.filter(p=>(!productFilters.name||p.name.toLowerCase().includes(productFilters.name.toLowerCase()))&&(productFilters.stock==='All'||(productFilters.stock==='In Stock'?Number(p.stock)>0:Number(p.stock)<=0)));
 content=`<div class="adminGrid"><section class="panel"><h3>Add a product</h3><form class="form" onsubmit="addProduct(event)"><label>Product name<input name="name" required></label><label>Description<input name="desc"></label><label>Category<input name="category" value="General" required></label><label>Price (PKR)<input name="price" type="number" min="1" required></label><label>Stock quantity<input name="stock" type="number" min="0" required></label><label>Product weight (kg)<input name="weightKg" type="number" min="0.01" step="0.01" value="0.5" required></label><label>Shipping charge (PKR)<input name="shippingCharge" type="number" min="0" value="${Number(integrations.shipping.baseCharge)||200}" required></label><label>Image URL (optional)<input name="image"></label><button class="cta">Save product</button></form></section><section class="panel"><h3>Product stock (${filteredProducts.length} / ${products.length})</h3><div class="adminFilters" style="grid-template-columns:repeat(2,minmax(0,1fr))"><label>Product Name<input placeholder="Search product" value="${esc(productFilters.name)}" onchange="productFilters.name=this.value;render()"></label><label>Stock status<select onchange="productFilters.stock=this.value;render()">${['All','In Stock','Out of Stock'].map(x=>`<option ${productFilters.stock===x?'selected':''}>${x}</option>`).join('')}</select></label><button class="cta" type="button" onclick="productFilters={name:'',stock:'All'};render()">Clear filters</button></div>${filteredProducts.map(p=>`<div class="row"><div><b>${esc(p.name)}</b><small>${money(p.price)} · Stock: <b>${p.stock}</b> · <span class="statusPill">${Number(p.stock)>0?'In Stock':'Out of Stock'}</span> · Weight: ${Number(p.weightKg||0.5)} kg · Shipping: ${money(p.shippingCharge||0)}</small></div><button type="button" onclick="removeProduct(${p.id})">Remove</button></div>`).join('')||'<p class="muted">No products match these filters.</p>'}</section></div>`;
}
if(adminTab==='themes')content=`<section class="panel"><h3>Store & Admin Theme Gallery</h3><p class="muted">Choose one of 10 professionally styled themes. Your selection is applied to both the customer storefront and admin panel and saved in this browser.</p><div class="themeGrid">${themes.map(t=>`<button type="button" class="themeChoice ${activeTheme===t.id?'selected':''}" onclick="chooseTheme('${t.id}')"><span class="swatches">${t.colors.map(c=>`<i style="background:${c}"></i>`).join('')}</span><span><b>${t.name}</b><small>${t.desc}</small>${activeTheme===t.id?'<small class="statusPill">Currently active</small>':''}</span></button>`).join('')}</div></section>`;
if(adminTab==='shipping')content=`<section class="panel"><h3>Shipping rate rules</h3><p class="muted">One shipping fee per order. Product shipping charge uses the highest selected product fee, not one fee per item. Weight above the included limit adds a per-kg charge.</p><form class="form" onsubmit="saveShipping(event)"><label>Default base shipping charge (PKR)<input name="baseCharge" type="number" min="0" value="${integrations.shipping.baseCharge}" required></label><label>Included shipment weight (kg)<input name="includedWeight" type="number" min="0.1" step="0.1" value="${integrations.shipping.includedWeight}" required></label><label>Extra charge per additional kg (PKR)<input name="extraPerKg" type="number" min="0" value="${integrations.shipping.extraPerKg}" required></label><button class="cta">Save shipping rules</button></form></section><section class="panel"><h3>Courier providers</h3><button type="button" class="plain" onclick="addProvider()">＋ Add another courier</button><form class="form" onsubmit="saveIntegrations(event)"><label>Default shipper<select name="defaultShipper">${integrations.providers.map(x=>`<option ${integrations.defaultShipper===x.name?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label>${integrations.providers.map((x,i)=>`<div class="panel"><label><span><input type="checkbox" name="enabled_${i}" ${x.enabled?'checked':''}> Enable ${esc(x.name)}</span></label><label>API Base URL<input name="url_${i}" value="${esc(x.apiUrl)}" placeholder="Add when account is ready"></label><label>API Token<input type="password" name="token_${i}" value="${esc(x.apiToken)}" placeholder="Configure on secure server"></label><label>Pickup address code<input name="pickup_${i}" value="${esc(x.pickupCode)}"></label></div>`).join('')}<h4>WhatsApp Business (future API setup)</h4><label><span><input type="checkbox" name="waEnabled" ${integrations.whatsapp.enabled?'checked':''}> Enable WhatsApp confirmations</span></label><label>Business phone<input name="waPhone" value="${esc(integrations.whatsapp.businessPhone)}"></label><label>Phone Number ID<input name="waPhoneId" value="${esc(integrations.whatsapp.phoneId)}"></label><label>Access token<input type="password" name="waToken" value="${esc(integrations.whatsapp.token)}"></label><label>Approved template<input name="waTemplate" value="${esc(integrations.whatsapp.template)}"></label><button class="cta">Save courier settings</button></form></section>`;
if(adminTab==='payments')content=`<section class="panel"><h3>Payment methods</h3><button type="button" class="plain" onclick="addPaymentOption()">＋ Add online payment option</button><p class="muted">Enable the methods customers can select at checkout. QR image can be a hosted image URL for this local demo. Card gateway requires a real payment provider integration; a QR is not a card processor.</p><form class="form" onsubmit="savePayments(event)">${integrations.payments.map((x,i)=>`<div class="panel"><label><span><input type="checkbox" name="enabled_${i}" ${x.enabled?'checked':''}> Enable ${esc(x.name)}</span></label><label>Display name<input name="name_${i}" value="${esc(x.name)}" required></label><label>Payment instructions / account details<textarea name="details_${i}">${esc(x.details||'')}</textarea></label><label>QR code image URL<input name="qr_${i}" value="${esc(x.qr||'')}" placeholder="Paste QR image URL"></label><label>Or upload QR image<input type="file" accept="image/*" onchange="loadQrFile(event,${i})"></label>${x.qr?`<img src="${esc(x.qr)}" style="max-width:130px;max-height:130px;object-fit:contain">`:''}</div>`).join('')}<button class="cta">Save payment settings</button></form></section>`;
return `<main class="wrap"><div class="eyebrow">STORE MANAGEMENT</div><h2>Admin dashboard</h2><div class="tabs">${tabs.map(([id,label])=>`<button class="${adminTab===id?'on':''}" onclick="adminTab='${id}';render()">${label}</button>`).join('')}<button type="button" onclick="exportData()">Export data</button><button type="button" onclick="resetDemo()">Reset demo</button></div>${content}</main>`;}

function addProvider(){const name=prompt("Courier provider name (e.g. Trax):");if(!name||!name.trim())return;if(integrations.providers.some(x=>x.name.toLowerCase()===name.trim().toLowerCase())){toast("Provider already exists");return;}integrations.providers.push({name:name.trim(),enabled:false,apiUrl:"",apiToken:"",pickupCode:""});localStorage.setItem("ns_integrations",JSON.stringify(integrations));adminTab="shipping";render();toast("Courier provider added; configure its API later");}
function addPaymentOption(){const name=prompt("New payment option name (e.g. SadaPay):");if(!name||!name.trim())return;integrations.payments.push({name:name.trim(),type:"online",enabled:false,details:"Add account/payment instructions",qr:""});localStorage.setItem("ns_integrations",JSON.stringify(integrations));adminTab="payments";render();toast("Payment option added");}
function loadQrFile(e,i){const file=e.target.files&&e.target.files[0];if(!file)return;if(!file.type.startsWith("image/")){toast("Please select an image file");return;}if(file.size>1500000){toast("QR image must be smaller than 1.5 MB in this local demo");return;}const reader=new FileReader();reader.onload=()=>{integrations.payments[i].qr=String(reader.result);localStorage.setItem("ns_integrations",JSON.stringify(integrations));render();toast("QR image saved")};reader.readAsDataURL(file);}
function saveShipping(e){e.preventDefault();let f=e.currentTarget;integrations.shipping={baseCharge:Number(f.elements.baseCharge.value),includedWeight:Number(f.elements.includedWeight.value),extraPerKg:Number(f.elements.extraPerKg.value)};localStorage.setItem('ns_integrations',JSON.stringify(integrations));toast('Shipping rules saved');render();}
function savePayments(e){e.preventDefault();let f=e.currentTarget;integrations.payments=integrations.payments.map((x,i)=>({...x,enabled:f.elements[`enabled_${i}`].checked,name:f.elements[`name_${i}`].value.trim(),details:f.elements[`details_${i}`].value.trim(),qr:f.elements[`qr_${i}`].value.trim()}));localStorage.setItem('ns_integrations',JSON.stringify(integrations));toast('Payment settings saved');render();}
function placeOrder(e){
  e.preventDefault();
  const form=e.currentTarget;
  try {
    const customer=String(form.elements.customer.value||"").trim();
    const phone=String(form.elements.phone.value||"").trim();
    const address=String(form.elements.address.value||"").trim();
    const city=String(form.elements.city.value||"").trim();
    if(!customer||!phone||!address||!city){toast("Please enter your name, phone and delivery address.");return false;}
    if(!cart.length){toast("Your bag is empty. Add a product first.");return false;}
    for(const x of cart){const p=products.find(p=>p.id===x.id);if(!p||Number(p.stock)<Number(x.qty)){toast("Stock changed; please review your bag.");return false;}}
    const subtotal=cart.reduce((a,x)=>a+Number(x.price)*Number(x.qty),0);
    const shipping=shippingFor(cart),total=subtotal+shipping;
    const payment=String(form.elements.payment?.value||"Cash on Delivery");
    const orderId=Date.now();
    const order={id:orderId,createdAt:new Date().toISOString(),customer,phone,address,city,subtotal,shipping,total,status:"Pending",payment,items:cart.map(x=>({name:x.name,qty:x.qty,price:x.price,weightKg:x.weightKg||0.5}))};
    // Save the order before clearing the cart so a storage failure cannot silently discard it.
    orders.push(order);
    cart.forEach(x=>{const p=products.find(p=>p.id===x.id);p.stock-=x.qty;});
    cart=[];
    save();
    drawer=false;checkout=false;render();
    toast("Order #"+orderId+" placed successfully · "+payment);
  } catch(err) {
    console.error("Checkout failed:",err);
    toast("Order error: "+(err && err.message ? err.message : "Please try again."));
  }
  return false;
}
function saveIntegrations(e){e.preventDefault();const f=e.currentTarget;integrations.defaultShipper=f.elements.defaultShipper.value;integrations.providers=integrations.providers.map((x,i)=>({...x,enabled:f.elements[`enabled_${i}`].checked,apiUrl:f.elements[`url_${i}`].value.trim(),apiToken:f.elements[`token_${i}`].value.trim(),pickupCode:f.elements[`pickup_${i}`].value.trim()}));integrations.whatsapp={enabled:f.elements.waEnabled.checked,businessPhone:f.elements.waPhone.value.trim(),phoneId:f.elements.waPhoneId.value.trim(),token:f.elements.waToken.value.trim(),template:f.elements.waTemplate.value.trim()};localStorage.setItem("ns_integrations",JSON.stringify(integrations));toast("Demo configuration saved in this browser");render()}
function addProduct(e){e.preventDefault();let f=new FormData(e.target);products.push({id:Date.now(),name:f.get("name"),desc:f.get("desc"),category:f.get("category"),price:Number(f.get("price")),stock:Number(f.get("stock")),weightKg:Number(f.get("weightKg")||0.5),shippingCharge:Number(f.get("shippingCharge")||0),image:f.get("image")});save();render();toast("Product added")}
function removeProduct(id){products=products.filter(p=>p.id!==id);cart=cart.filter(x=>x.id!==id);save();render()}
function updateStatus(id,s){let o=orders.find(x=>x.id===id);o.status=s;save();toast("Order status updated")}
function exportData(){let blob=new Blob([JSON.stringify({products,orders},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="northstar-store-data.json";a.click();URL.revokeObjectURL(a.href)}
function resetDemo(){if(confirm("Reset products and orders to original demo data?")){products=starter.map(x=>({...x}));orders=[];cart=[];save();render()}}
render();
</script></body></html>
