services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-storedb}
      POSTGRES_USER: ${POSTGRES_USER:-storeuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-storeuser} -d ${POSTGRES_DB:-storedb}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  api:
    build: ./backend
    env_file: .env
    environment:
      PostEx__SecretDirectory: /run/naturwala/postex
      ASPNETCORE_URLS: http://+:8080
      Owner__Email: ${Owner__Email:?Set Owner__Email in .env}
      Owner__Password: ${Owner__Password:?Set Owner__Password in .env}
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB:-storedb};Username=${POSTGRES_USER:-storeuser};Password=${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./private/postex:/run/naturwala/postex:ro
      - appkeys:/root/.aspnet/DataProtection-Keys
    restart: unless-stopped
  web:
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:80"
    depends_on: [api]
    restart: unless-stopped
volumes:
  pgdata:
  appkeys:
